    <div *ngIf="showAdd || showRefresh" class="row">
        <div  class="col-lg-12">
            <button *ngIf="showAdd" class="btn btn-primary" type="button" (click)="onClickNew()">
                <i class="fa fa-plus"></i>
                New
            </button>
            <button *ngIf="showRefresh" class="btn btn-warning pull-right" type="button" (click)="onClickRefresh()">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <ng-container outsideBody>
        <div class="table-responsive text-nowrap">
            <dx-data-grid id="dataGrid"  [dataSource]="dataSource" [columns]="columns" [remoteOperations]="false"
                    [(selectedRowKeys)]="selectedRows"
                    [keyExpr]="selectedRowColumn"
                    [allowColumnReordering]="true" [rowAlternationEnabled]="true" [showBorders]="true">
                <dxo-paging [pageSize]="10"></dxo-paging>
                <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 25, 50, 100]"></dxo-pager>
                <dxo-search-panel *ngIf="showSearch" [visible]="true" [highlightCaseSensitive]="true"></dxo-search-panel>
                <dxo-export *ngIf="showExport" [enabled]="true" fileName="export" [allowExportSelectedData]="false">
                </dxo-export>
                <dxo-selection *ngIf="showSelection"
                    selectAllMode="allPages"
                    showCheckBoxesMode="onClick"
                    mode="multiple"
                ></dxo-selection>

                <div *dxTemplate="let data of 'actionTemplate'">
                    <button type="button" *ngIf="data.data.isActive" class="btn btn-warning pull-left"
                        (click)="onClickEdit(data.data)" title="Edit">
                        <i class="fa fa-edit"></i>
                    </button>
                    <button type="button" *ngIf="data.data.isActive" (click)="onClickDisable(data.data)"
                        class="btn btn-danger pull-left" title="Disable">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    <button type="button" *ngIf="!data.data.isActive" (click)="onClickEnable(data.data)"
                        class="btn btn-success pull-left" title="Enable">
                        <i class="fas fa-check-circle"></i>
                    </button>
                </div>

                <div *dxTemplate="let data of 'removeTemplate'">
                  <button type="button" class="btn btn-danger pull-left"
                      (click)="onClickRemove(data.data)" title="Remove">
                      <i class="fa fa-times"></i>
                  </button>
              </div>

                <div *dxTemplate="let data of 'statusTemplate'">
                    <i *ngIf="data.data.isActive" class="fas fa-check-circle text-green"> ACTIVE</i>
                    <i *ngIf="!data.data.isActive" class="fas fa-trash-alt text-danger"> INACTIVE</i>
                </div>

                <div *dxTemplate="let data of 'dateTemplate'">
                  {{   data.value | date : DisplayFormatDate }}
                </div>
                <div *dxTemplate="let data of 'dateTimeTemplate'">
                  {{   data.value | date : DisplayFormatDateTime }}
                </div>

                <div *dxTemplate="let data of 'checkTemplate'">
                  <i *ngIf="data.value" class="fas fa-check-circle text-green"></i>
                  <i *ngIf="!data.value" class="fas fa-ban text-danger"></i>
              </div>

            </dx-data-grid>
        </div>
    </ng-container>
