<panel [title]="title" footerClass="p-b-0 p-t-20 b-t-0">
  <ng-content select="[filterBody]"></ng-content>

  <div *ngIf="showAdd || showRefresh" class="row">
    <div class="col-lg-12">
      <button
        *ngIf="showAdd"
        [appCanAccess]="permissionAllowCreate"
        class="btn btn-primary"
        type="button"
        (click)="onClickNew()"
      >
        <i class="fa fa-plus"></i>
        New
      </button>
      <button
        *ngIf="showSearchButton"
        [appCanAccess]="permissionAllowCreate"
        class="btn btn-primary"
        type="button"
        (click)="onClickSearch()"
      >
        <i class="fa fa-search"></i>
        Buscar
      </button>
      <button
        *ngIf="showRefresh"
        class="btn btn-warning pull-right"
        type="button"
        (click)="onClickRefresh()"
      >
        <i class="fas fa-sync-alt"></i>
      </button>
    </div>
  </div>

  <ng-container outsideBody>
    <!-- (onRowPrepared)="dxOnRowPrepared($event)" -->
    <div class="table-responsive text-nowrap">
      <dx-data-grid
        id="dataGrid"
        [dataSource]="dataSource"
        [columns]="columns"
        [remoteOperations]="false"
        [allowColumnReordering]="true"
        [rowAlternationEnabled]="true"
        [showBorders]="true"
      >
        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager
          [showPageSizeSelector]="true"
          [allowedPageSizes]="[10, 25, 50, 100]"
        ></dxo-pager>
        <dxo-search-panel
          *ngIf="showSearch"
          [visible]="true"
          [highlightCaseSensitive]="true"
        >
        </dxo-search-panel>
        <dxo-export
          *ngIf="showExport"
          [enabled]="true"
          [fileName]="title"
          [allowExportSelectedData]="false"
        >
        </dxo-export>
        <dxo-selection
          *ngIf="showSelection"
          selectAllMode="allPages"
          showCheckBoxesMode="onClick"
          mode="multiple"
        ></dxo-selection>
        <dxo-header-filter [visible]="true"></dxo-header-filter>

        <div *dxTemplate="let data of 'actionTemplate'">
          <button
            type="button"
            [appCanAccess]="permissionAllowUpdate"
            *ngIf="data.data.isActive"
            class="btn btn-warning pull-left btn-sm"
            (click)="onClickEdit(data.data)"
            title="Edit"
          >
            <i class="fa fa-edit"></i>
          </button>
          <button
            type="button"
            [appCanAccess]="permissionAllowDisable"
            *ngIf="data.data.isActive && showDisable"
            (click)="onClickDisable(data.data)"
            class="btn btn-danger pull-left btn-sm"
            title="Disable"
          >
            <i class="fas fa-trash-alt"></i>
          </button>
          <button
            type="button"
            [appCanAccess]="permissionAllowEnable"
            *ngIf="!data.data.isActive && showEnable"
            (click)="onClickEnable(data.data)"
            class="btn btn-success pull-left btn-sm"
            title="Enable"
          >
            <i class="fas fa-check-circle"></i>
          </button>
          <button
            type="button"
            *ngIf="showGoTo === true"
            (click)="onClickGoTo(data.data)"
            class="btn btn-info pull-left btn-sm"
            title="Go to"
          >
            <i class="fas fa-share-square"></i>
          </button>
        </div>

        <div *dxTemplate="let data of 'customActionTemplate'">
          <button
            type="button"
            [appCanAccess]="permissionAllowUpdate"
            *ngIf="data.data.isActive"
            class="btn btn-warning pull-left btn-sm"
            (click)="onClickEdit(data.data)"
            title="Edit"
          >
            <i class="fa fa-edit"></i>
          </button>
          <button
            type="button"
            [appCanAccess]="permissionAllowUpdate"
            *ngIf="data.data.isActive"
            class="btn btn-primary pull-left btn-sm"
            (click)="onClickDriverCall(data.data)"
            title="Edit"
          >
            <i class="fa fa-phone"></i>
          </button>
          <button
            type="button"
            [appCanAccess]="permissionAllowDisable"
            *ngIf="data.data.isActive && showDisable"
            (click)="onClickDisable(data.data)"
            class="btn btn-danger pull-left btn-sm"
            title="Disable"
          >
            <i class="fas fa-trash-alt"></i>
          </button>
          <button
            type="button"
            [appCanAccess]="permissionAllowEnable"
            *ngIf="!data.data.isActive && showEnable"
            (click)="onClickEnable(data.data)"
            class="btn btn-success pull-left btn-sm"
            title="Enable"
          >
            <i class="fas fa-check-circle"></i>
          </button>
          <!-- <button
            type="button"
            *ngIf="onGoTo !== undefined && onGoTo !== null"
            (click)="onClickGoTo(data.data)"
            class="btn btn-info pull-left btn-sm"
            title="Go to"
          >
            <i class="fas fa-share-square"></i>
          </button> -->
        </div>

        <div *dxTemplate="let data of 'statusTemplate'">
          <i *ngIf="data.data.isActive" class="fas fa-check-circle text-green">
            ACTIVE</i
          >
          <i *ngIf="!data.data.isActive" class="fas fa-trash-alt text-danger">
            INACTIVE</i
          >
        </div>

        <div *dxTemplate="let data of 'dateTemplate'">
          {{ data.value | date: DisplayFormatDate }}
        </div>
        <div *dxTemplate="let data of 'dateTimeTemplate'">
          {{ data.value | date: DisplayFormatDateTime }}
        </div>
        <div *dxTemplate="let data of 'amountTemplate'">
          {{ data.value | currency: Currency }}
        </div>
        <div *dxTemplate="let data of 'percentageTemplate'">
          {{ data.value | number: '1.2-2' }} %
        </div>
        <div *dxTemplate="let data of 'deleteTemplate'">
          <button
            type="button"
            (click)="onClickDelete(data.data)"
            class="btn btn-success pull-left btn-sm"
            title="Delete"
          >
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div *dxTemplate="let data of 'memoTemplate'">
          <dx-text-area [height]="100" #notes [(value)]="data.data.memo" disabled="true"></dx-text-area>
        </div>

        <div *dxTemplate="let data of 'checkTemplate'">
          <i *ngIf="data.value" class="fas fa-check-circle text-green"></i>
          <i *ngIf="!data.value" class="fas fa-ban text-danger"></i>
        </div>
        <dxo-summary>
          <dxi-total-item 
          column="amount" 
          summaryType="sum"
          [customizeText]="dxCustomizeCurrency"
          displayFormat="{0}"></dxi-total-item>
        </dxo-summary>
      </dx-data-grid>
    </div>
  </ng-container>
</panel>
