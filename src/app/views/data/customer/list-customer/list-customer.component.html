<app-basic-table-list [title]="title" [columns]="columns" [dataSource]="DataSource" [appCanAccess]="[]"
    [permissionAllowCreate]="['DATA.CUSTOMER.CREATE']" [permissionAllowUpdate]="['DATA.CUSTOMER.UPDATE']"
    [permissionAllowDisable]="['DATA.CUSTOMER.DISABLE']" [permissionAllowEnable]="['DATA.CUSTOMER.ENABLE']"
    (onRefresh)="getAll()" (onNew)="create()" (onEdit)="update($event)" (onDisable)="disable($event)"
    (onEnable)="enable($event)">
</app-basic-table-list>

<app-create-or-update-customer #createOrUpdateModal (modalSave)="getAll()"></app-create-or-update-customer>
