<app-basic-table-list [title]="title" [columns]="columns" [dataSource]="DataSource" [appCanAccess]="[]"
  [permissionAllowCreate]="['DATA.ROUTE.CREATE']" [permissionAllowUpdate]="['DATA.ROUTE.UPDATE']"
  [permissionAllowDisable]="['DATA.ROUTE.DISABLE']" [permissionAllowEnable]="['DATA.ROUTE.ENABLE']"
  (onRefresh)="getAll()" (onNew)="create()" (onEdit)="update($event)" (onDisable)="disable($event)"
  (onEnable)="enable($event)">
</app-basic-table-list>

<app-create-or-update-route #createOrUpdateModal (modalSave)="getAll()"></app-create-or-update-route>
