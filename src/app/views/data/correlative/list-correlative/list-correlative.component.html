<app-basic-table-list [title]="title" [columns]="columns" [dataSource]="DataSource" [appCanAccess]="[]"
    [permissionAllowCreate]="['DATA.CORRELATIVE.CREATE']" [permissionAllowUpdate]="['DATA.CORRELATIVE.UPDATE']"
    [permissionAllowDisable]="['DATA.CORRELATIVE.DISABLE']" [permissionAllowEnable]="['DATA.CORRELATIVE.ENABLE']"
    (onRefresh)="getAll()" (onNew)="create()" (onEdit)="update($event)" (onDisable)="disable($event)"
    (onEnable)="enable($event)">
</app-basic-table-list>

<app-create-or-update-correlative #createOrUpdateModal (modalSave)="getAll()"></app-create-or-update-correlative>
