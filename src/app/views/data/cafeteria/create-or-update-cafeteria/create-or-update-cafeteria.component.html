<app-modal-with-option-buttons #entityComponent title="Type" [optionButtons]="OptionButtons"
  (onOptionButton)="optionButtonClicked($event)" (onClose)="close()" [size]="'xxxl'">
  <div>
    <div class="row row-space-10">
      <section class="col-md-12 col-xs-12">
        <ngb-tabset type="pills">
          <ngb-tab>
            <ng-template ngbTabTitle>
              <span class="d-sm-none">General</span>
              <span class="d-sm-block d-none">General</span>
            </ng-template>
            <ng-template ngbTabContent >
              <div class="row row-space-10" style="padding-top: 10px;">
                <section class="col-md-6 col-xs-12">
                  <div class="form-group">
                    <label for="name">Nombre<i class="text-danger">*</i></label>
                    <input id="name" name="name" [(ngModel)]="Model.name" #name="ngModel" class="form-control" placeholder=""
                      type="text" />
                    <app-validator-message [error]="errors" field="name"></app-validator-message>
                  </div>
                </section>
          
                <section class="col-md-6 col-xs-12">
                  <div class="form-group">
                    <label for="code">Codigo<i class="text-danger">*</i></label>
                    <input id="code" name="code" [(ngModel)]="Model.code" #code="ngModel" class="form-control" placeholder=""
                      type="text" />
                    <app-validator-message [error]="errors" field="name"></app-validator-message>
                  </div>
                </section>
          
                <section class="col-md-6 col-xs-12" *ngIf="Model.id > 0">
                  <div class="form-group">
                    <label for="purchaseOrderCorelative">Corelativo orden de compra<i class="text-danger">*</i></label>
                    <input id="purchaseOrderCorelative" name="purchaseOrderCorelative" [(ngModel)]="Model.purchaseOrderCorelative" #purchaseOrderCorelative="ngModel" class="form-control" placeholder=""
                      type="text" [disabled]="Model.id > 0" />
                  </div>
                </section>
          
                <section class="col-md-6 col-xs-12" *ngIf="Model.id > 0">
                  <div class="form-group">
                    <label for="specialServicesCorelative">Corelativo servicios especiales<i class="text-danger">*</i></label>
                    <input id="specialServicesCorelative" name="specialServicesCorelative" [(ngModel)]="Model.specialServicesCorelative" #specialServicesCorelative="ngModel" class="form-control" placeholder=""
                      type="text" [disabled]="Model.id > 0" />
                  </div>
                </section>
          
                <section class="col-md-6 col-xs-12" *ngIf="Model.id > 0">
                  <div class="form-group">
                    <label for="officeRequisitionCorelative">Corelativo orden de requisición<i class="text-danger">*</i></label>
                    <input id="officeRequisitionCorelative" name="officeRequisitionCorelative" [(ngModel)]="Model.officeRequisitionCorelative" #officeRequisitionCorelative="ngModel" class="form-control" placeholder=""
                      type="text" [disabled]="Model.id > 0" />
                  </div>
                </section>
          
                <section class="col-md-12 col-xs-12">
                  <div class="form-group">
                    <label for="name">Clientes <i class="text-danger"></i></label>
                    <dx-select-box displayExpr="name" valueExpr="id" [searchEnabled]="true" [dataSource]="DxDatasourceCustomers" [(value)]="customerId" (onItemClick)="onItemClickCustomer($event.itemData)">
                    </dx-select-box>
                  </div>
                </section>
          
                <section class="col-md-12 col-xs-12">
                  <button style="margin-right: 5px; margin-bottom: 5px;" *ngFor="let customer of Model.customers;" type="button" class="btn btn-primary btn-social btn-adn">
                    {{customer.customer}} <i style="margin-left: 10px;" (click)="removeItemCustomer(customer)"
                      class="fas fa-backspace fa-2x pull-right"> </i>
                  </button>
                </section>
              </div>
            </ng-template>
          </ngb-tab>
          <ngb-tab>
            <ng-template ngbTabTitle>
              <span class="d-sm-none">Platos</span>
            <span class="d-sm-block d-none">Platos</span>
            </ng-template>
            <ng-template ngbTabContent >
              <div class="row row-space-10" style="padding-top: 10px;">
                <section class="col-md-12 col-xs-12">
                  <p>Platos</p>
                </section>
              </div>
            </ng-template>
          </ngb-tab>
          <ngb-tab>
            <ng-template ngbTabTitle>
              <span class="d-sm-none">Complementos</span>
            <span class="d-sm-block d-none">Complementos</span>
            </ng-template>
            <ng-template ngbTabContent >
              <div class="row row-space-10" style="padding-top: 10px;">
                <section class="col-md-12 col-xs-12">
                  <p>Complementos</p>
                </section>
              </div>
            </ng-template>
          </ngb-tab>
          <ngb-tab>
            <ng-template ngbTabTitle>
              <span class="d-sm-none">Bebidas</span>
            <span class="d-sm-block d-none">Bebidas</span>
            </ng-template>
            <ng-template ngbTabContent >
              <div class="row row-space-10" style="padding-top: 10px;">
                <section class="col-md-12 col-xs-12">
                  <p>Bebidas</p>
                </section>
              </div>
            </ng-template>
          </ngb-tab>
        </ngb-tabset>
      </section>
      

    </div>
  </div>
</app-modal-with-option-buttons>
