<app-modal-with-option-buttons #entityComponent [title]="title" [optionButtons]="OptionButtons"
  (onOptionButton)="optionButtonClicked($event)" (onClose)="close()">
  <div class="row row-space-10">
    <section class="col-md-6 col-xs-12">
      <div class="form-group">
        <label for="name">Nombre<i class="text-danger">*</i></label>
        <dx-text-box #name [(value)]="Model.name">
        </dx-text-box>
        <app-validator-message [error]="errors" field="name"></app-validator-message>
      </div>
    </section>
    <section class="col-md-6 col-xs-12">
      <div class="form-group">
        <label for="name">Cafeteria<i class="text-danger">*</i></label>
        <dx-select-box displayExpr="name" valueExpr="id" [searchEnabled]="true"
          [dataSource]="DxDataSourceCafeteria" [(value)]="Model.cafeteriaId">
        </dx-select-box>
        <app-validator-message [error]="errors" field="cafeteria"></app-validator-message>
      </div>
    </section>
    <section class="col-md-12 col-xs-12">
      <div class="custom-control custom-switch">
        <input type="checkbox" [(ngModel)]="Model.useInInventory" #useInInventory="ngModel"
          class="custom-control-input" id="useInInventory">
        <label class="custom-control-label" for="useInInventory">Usar en inventario</label>
      </div>
    </section>
  </div>
</app-modal-with-option-buttons>
