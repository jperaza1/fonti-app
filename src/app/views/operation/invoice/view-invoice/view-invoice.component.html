<panel [title]="title" footerClass="p-b-0 p-t-20 b-t-0" panelClass="invoice-view-panel">
  <div class="invoice-view" [class.invoice-view--split]="Model.documentId > 0">
    <div class="invoice-view__main">
    <!-- Información general -->
    <section class="invoice-view__card invoice-view__card--animate">
      <h3 class="invoice-view__card-title">Información general</h3>
      <div class="invoice-view__grid invoice-view__grid--3">
        <div class="invoice-view__field">
          <label class="invoice-view__label">Ruta</label>
          <dx-text-box #route [(value)]="Model.route" disabled="true"></dx-text-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">Proveedor</label>
          <dx-text-box #vendorName [(value)]="Model.vendorName" disabled="true"></dx-text-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">Número de Factura</label>
          <dx-text-box #invoiceNumber [(value)]="Model.invoiceNumber" disabled="true" mask="000-000-00-00000000"></dx-text-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">Tipo de Pago</label>
          <dx-text-box [(value)]="Model.paymentTypeName" disabled="true"></dx-text-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">Estado de Pago</label>
          <dx-text-box [(value)]="Model.paymentStatusName" disabled="true"></dx-text-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">Fecha de Factura <i class="text-danger">*</i></label>
          <dx-date-box [(value)]="Model.invoiceDate" [displayFormat]="DisplayFormatDate" [disabled]="!updatePermission"></dx-date-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">Fecha de Vencimiento</label>
          <dx-date-box [(value)]="Model.dueDate" [displayFormat]="DisplayFormatDate" disabled="true"></dx-date-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">Días Restantes</label>
          <dx-number-box #remainingDays [(value)]="Model.remainingDays" disabled="true"></dx-number-box>
        </div>
        <div class="invoice-view__field">
          <br />
          <div class="custom-control custom-switch">
            <input type="checkbox" [(ngModel)]="Model.isRefound" #isRefound="ngModel"
              class="custom-control-input" id="isRefound" [disabled]="!updatePermission">
            <label class="custom-control-label" for="isRefound">Es reembolso</label>
          </div>
        </div>
        <div class="invoice-view__field invoice-view__field--full">
          <label class="invoice-view__label">Descripción</label>
          <dx-text-area [height]="140" #description [(value)]="Model.description" disabled="true"></dx-text-area>
        </div>
      </div>
    </section>

    <!-- Montos y totales -->
    <section class="invoice-view__card invoice-view__card--totals invoice-view__card--animate">
      <h3 class="invoice-view__card-title">Montos</h3>
      <div class="invoice-view__grid invoice-view__grid--4">
        <div class="invoice-view__field">
          <label class="invoice-view__label">Monto Gravado <i class="text-danger">*</i></label>
          <dx-number-box #taxableAmount [(value)]="Model.taxableAmount" [format]="CurrencyDxNumber" disabled="true"></dx-number-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">Monto Exento <i class="text-danger">*</i></label>
          <dx-number-box #exemptAmount [(value)]="Model.exemptAmount" [format]="CurrencyDxNumber" disabled="true"></dx-number-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">Descuento</label>
          <dx-number-box #discount [(value)]="Model.discount" [format]="CurrencyDxNumber" disabled="true"></dx-number-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">Subtotal</label>
          <dx-number-box #subTotal [(value)]="Model.subTotal" [format]="CurrencyDxNumber" disabled="true"></dx-number-box>
        </div>
        <div class="invoice-view__field">
          <label class="invoice-view__label">ISV 15%</label>
          <dx-number-box #taxAmount [(value)]="Model.taxAmount" [format]="CurrencyDxNumber" disabled="true"></dx-number-box>
        </div>
        <div class="invoice-view__field invoice-view__field--highlight">
          <label class="invoice-view__label">Total</label>
          <dx-number-box #total [(value)]="Model.total" [format]="CurrencyDxNumber" disabled="true"></dx-number-box>
        </div>
        <div class="invoice-view__field invoice-view__field--highlight">
          <label class="invoice-view__label">Saldo</label>
          <dx-number-box #balance [(value)]="Model.balance" [format]="CurrencyDxNumber" disabled="true"></dx-number-box>
        </div>
      </div>
    </section>

    <!-- Pagos -->
    <section class="invoice-view__card invoice-view__card--payments invoice-view__card--animate">
      <div class="invoice-view__card-header">
        <h3 class="invoice-view__card-title">Pagos</h3>
        <button
          class="invoice-view__btn invoice-view__btn--primary"
          type="button"
          (click)="addPaymentClick()"
          [appCanAccess]="['OPERATION.INVOICE.PAYMENT.CREATE']"
          *ngIf="Model.balance > 0"
        >
          <i class="fa fa-plus"></i>
          Nuevo Pago
        </button>
      </div>
      <div class="invoice-view__grid-wrapper">
        <dx-data-grid
          id="dataGrid"
          [dataSource]="Model.payments"
          [columns]="columns"
          [remoteOperations]="false"
          [allowColumnReordering]="true"
          [rowAlternationEnabled]="true"
          [showBorders]="true"
          [columnAutoWidth]="true">
          <dxo-export [enabled]="true" fileName="Pagos" [allowExportSelectedData]="false"></dxo-export>
          <div *dxTemplate="let data of 'dateTemplate'">
            {{ data.value | date: DisplayFormatDate }}
          </div>
          <div *dxTemplate="let data of 'amountTemplate'">
            {{ data.value | currency : Currency }}
          </div>
          <dxo-summary>
            <dxi-total-item column="amount" summaryType="sum" [customizeText]="dxCustomizeCurrency" displayFormat="{0}"></dxi-total-item>
          </dxo-summary>
        </dx-data-grid>
      </div>
    </section>

    <!-- Acciones -->
    <div class="invoice-view__actions">
      <button type="button" class="invoice-view__btn invoice-view__btn--secondary" (click)="return()">
        <i class="fa fa-arrow-left"></i>
        Regresar
      </button>
      <div class="invoice-view__actions-group">
        <button type="button" class="invoice-view__btn invoice-view__btn--ghost" (click)="changePaymentType()" [appCanAccess]="['OPERATION.INVOICE.CHANGE_PAYMENT_TYPE']">
          <i class="fa fa-exchange-alt"></i>
          Cambiar Tipo de Pago
        </button>
        <button type="button" class="invoice-view__btn invoice-view__btn--primary" (click)="updateInvoice()" [appCanAccess]="['OPERATION.INVOICE.UPDATE']">
          <i class="fa fa-edit"></i>
          Editar
        </button>
      </div>
    </div>
    </div>

    <aside class="invoice-view__hero" *ngIf="Model.documentId > 0">
      <div class="invoice-view__hero-head">
        <div>
          <div class="invoice-view__hero-label">Documento</div>
          <p class="invoice-view__hero-hint">Haz clic para verlo en grande.</p>
        </div>
      </div>
      <div
        class="invoice-doc-preview"
        (click)="openImageLightbox()"
        (keydown.enter)="openImageLightbox()"
        (keydown.space)="openImageLightbox(); $event.preventDefault()"
        role="button"
        tabindex="0"
      >
        <div class="invoice-doc-preview__frame">
          <iframe [src]="getDocumentUrl(Model.documentId)" title="Vista previa del documento" class="invoice-doc-preview__doc"></iframe>
          <div class="invoice-doc-preview__overlay">
            <span class="invoice-doc-preview__icon" aria-hidden="true"><i class="fa fa-search-plus"></i></span>
            <span class="invoice-doc-preview__hint">Ver en grande</span>
          </div>
        </div>
      </div>
    </aside>
  </div>
</panel>

<!-- Lightbox -->
<div class="invoice-lightbox" *ngIf="showImageLightbox" (click)="closeImageLightbox()" role="dialog" aria-modal="true" aria-label="Vista ampliada del documento">
  <button class="invoice-lightbox__close" (click)="closeImageLightbox(); $event.stopPropagation()" aria-label="Cerrar">
    <i class="fa fa-times" aria-hidden="true"></i>
  </button>
  <div class="invoice-lightbox__content" (click)="$event.stopPropagation()">
    <iframe [src]="getDocumentUrl(Model.documentId)" title="Documento en tamaño completo" class="invoice-lightbox__doc"></iframe>
  </div>
</div>

<app-add-payment #addPayment (modalSave)="loadInvoiceInfo()"></app-add-payment>
