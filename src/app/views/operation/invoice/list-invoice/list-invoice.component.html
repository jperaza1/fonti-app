<panel [title]="title" footerClass="p-b-0 p-t-20 b-t-0">
  <div class="row row-space-10">
    <section class="col-md-3 col-xs-12">
      <div class="form-group">
        <label for="name">Ruta</label>
        <dx-select-box #routeId [(value)]="filterModel.routeId" [dataSource]="DxDatasourceRoute" displayExpr="name" valueExpr="id"></dx-select-box>
      </div>
    </section>
    <section class="col-md-3 col-xs-12">
      <div class="form-group">
        <label for="name">Proveedor</label>
        <dx-select-box #vendorId [(value)]="filterModel.vendorId" [dataSource]="DxDatasourceVendor" displayExpr="name" valueExpr="id"></dx-select-box>
      </div>
    </section>
    <section class="col-md-3 col-xs-12">
      <div class="form-group">
        <label for="name">Tipo de Pago</label>
        <dx-select-box #paymentType [(value)]="filterModel.paymentType" [dataSource]="DxDatasourcePaymentType" displayExpr="text" valueExpr="value"></dx-select-box>
      </div>
    </section>
    <section class="col-md-4 col-xs-12">
      <div class="form-group">
        <label for="name">Estado de Pago</label>
        <dx-select-box #paymentStatus [(value)]="filterModel.paymentStatus" [dataSource]="DxDatasourcePaymentStatus" displayExpr="text" valueExpr="value"></dx-select-box>
      </div>
    </section>
    <section class="col-md-4 col-xs-12">
      <div class="form-group">
        <label for="name">Inicio</label>
        <dx-date-box [(max)]="filterModel.dateTo" [(value)]="filterModel.dateFrom" [displayFormat]="DisplayFormatDate"></dx-date-box>
      </div>
    </section>
    <section class="col-md-4 col-xs-12">
      <div class="form-group">
        <label for="name">Fin</label>
        <dx-date-box [(value)]="filterModel.dateTo" [displayFormat]="DisplayFormatDate" [(min)]="filterModel.dateFrom"></dx-date-box>
      </div>
    </section>
    <section class="col-md-4 col-xs-12" style="margin-top: 25px;">
      <button class="btn btn-primary" (click)="search()"><i class="fa fa-search"></i> Buscar</button>
    </section>
  </div>
  <div class="row row-space-10">
    <section class="col-md-12 col-xs-12">
      <dx-data-grid
      id="dataGrid"
      [dataSource]="DataSource"
      [columns]="columns"
      [remoteOperations]="false"
      [allowColumnReordering]="true"
      [rowAlternationEnabled]="true"
      [showBorders]="true"
      [columnAutoWidth]="true">
      <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager
          [showPageSizeSelector]="true"
          [allowedPageSizes]="[10, 25, 50, 100]"
        ></dxo-pager>
        <dxo-search-panel
          [visible]="true"
          [highlightCaseSensitive]="true"
        >
        </dxo-search-panel>
        <dxo-export [enabled]="true" fileName="Customers" [allowExportSelectedData]="false">
        </dxo-export>
        <div *dxTemplate="let data of 'actionTemplate'">
          <button
            type="button"
            class="btn btn-primary pull-left btn-sm"
            [appCanAccess]="['OPERATION.INVOICE.VIEW']"
            (click)="viewInvoice(data.data)"
            title="Ver"
          >
            <i class="fa fa-eye"></i>
          </button>
          <button
            type="button"
            class="btn btn-danger pull-left btn-sm"
            [appCanAccess]="['OPERATION.INVOICE.DELETE']"
            (click)="deleteInvoice(data.data)"
            title="Eliminar"
          >
            <i class="fa fa-trash"></i>
          </button>
        </div>
        <div *dxTemplate="let data of 'dateTemplate'">
          {{ data.value | date: DisplayFormatDate }}
        </div>
        <div *dxTemplate="let data of 'amountTemplate'">
          {{ data.value | currency : Currency }}
        </div>
        <div *dxTemplate="let data of 'invoiceNumberTemplate'" >
          {{ formatInvoiceNumber(data.value) }}
        </div>
        <div *dxTemplate="let data of 'paymentStatusTemplate'">
          <span *ngIf="data.data.paymentStatus === 1" class="label label-warning">{{ data.data.paymentStatusName }}</span>
          <span *ngIf="data.data.paymentStatus === 2" class="label label-primary">{{ data.data.paymentStatusName }}</span>
          <span *ngIf="data.data.paymentStatus === 3" class="label label-success">{{ data.data.paymentStatusName }}</span>
          <span *ngIf="data.data.paymentStatus === 4" class="label label-danger">{{ data.data.paymentStatusName }}</span>
        </div>
        <dxo-summary>
          <dxi-total-item 
          column="total" 
          summaryType="sum"
          [customizeText]="dxCustomizeCurrency"
          displayFormat="{0}"></dxi-total-item>
        <dxi-total-item 
          column="balance" 
          summaryType="sum"
          [customizeText]="dxCustomizeCurrency"
          displayFormat="{0}"></dxi-total-item>
        </dxo-summary>
      </dx-data-grid>
    </section>
  </div>
</panel>
