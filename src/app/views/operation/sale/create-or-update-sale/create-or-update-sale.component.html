<app-modal-with-option-buttons #entityComponent [title]="title" [optionButtons]="OptionButtons"
  (onOptionButton)="optionButtonClicked($event)" (onClose)="close()" [size]="'xxxl'">
  <div class="route-form">
    <!-- Información general -->
    <div class="route-form__section">
      <div class="route-form__legend">
        <i class="fas fa-route"></i> Información general
      </div>
      <div class="row row-space-10">
        <section class="col-md-4 col-xs-12">
          <div class="form-group">
            <label for="name">Ruta<i class="text-danger">*</i></label>
            <dx-select-box displayExpr="name" valueExpr="id" [searchEnabled]="true"
              [dataSource]="DxDataSourceRoute" [(value)]="Model.routeId" (onItemClick)="onRouteItemClick($event.itemData)" [disabled]="Model.id > 0">
            </dx-select-box>
            <app-validator-message [error]="errors" field="cafeteria"></app-validator-message>
          </div>
        </section>
        <section class="col-md-4 col-xs-12" >
          <div class="form-group">
            <label for="name">Tipo de Venta<i class="text-danger">*</i></label>
            <dx-select-box displayExpr="text" valueExpr="value" [searchEnabled]="true"
              [dataSource]="DxDataSourceSaleType" [(value)]="Model.saleType" [disabled]="Model.id > 0">
            </dx-select-box>
            <app-validator-message [error]="errors" field="saleType"></app-validator-message>
          </div>
        </section>
        <section class="col-md-4 col-xs-12" *ngIf="Model.saleType === 2">
          <div class="form-group">
            <label for="name">Cliente<i class="text-danger">*</i></label>
            <dx-select-box displayExpr="name" valueExpr="id" [searchEnabled]="true"
              [dataSource]="DxDataSourceCustomer" [(value)]="Model.customerId" [disabled]="Model.id > 0">
            </dx-select-box>
            <app-validator-message [error]="errors" field="customerId"></app-validator-message>
          </div>
        </section>
        <section class="col-md-6 col-xs-12">
          <div class="form-group">
            <label for="name">Fecha de Venta<i class="text-danger">*</i></label>
            <dx-date-box [(value)]="Model.saleDate" [displayFormat]="DisplayFormatDate" [disabled]="Model.id > 0"></dx-date-box>
            <app-validator-message [error]="errors" field="saleDate"></app-validator-message>
          </div>
        </section>
        <section class="col-md-6 col-xs-12">
          <div class="form-group">
            <label for="name">Monto<i class="text-danger">*</i></label>
            <dx-number-box #amount [(value)]="Model.amount" [format]="CurrencyDxNumber" [disabled]="true"></dx-number-box>
            <app-validator-message [error]="errors" field="amount"></app-validator-message>
          </div>
        </section>
      </div>
    </div>

    <!-- Talonario: precios por producto -->
    <div class="route-form__section route-form__section--talonario">
      <div class="route-form__legend">
        <i class="fas fa-receipt"></i> Detalles de Venta
      </div>
      <p class="route-form__hint">Agregue los productos y cantidades asociados a esta venta.</p>

      <div class="route-form__grid-wrapper">
        <dx-data-grid [dataSource]="Model.saleDetails" [showBorders]="true" [columnAutoWidth]="true" #dataGrid>
          <dxi-column dataField="product" caption="Producto"></dxi-column>
          <dxi-column dataField="price" caption="Precio" cellTemplate="amountTemplate"></dxi-column>
          <dxi-column dataField="quantity" caption="Cantidad" cellTemplate="quantityTemplate"></dxi-column>
          <dxi-column dataField="total" caption="Total" cellTemplate="amountTemplate"></dxi-column>
          <dxi-column dataField="action" caption="Acciones" cellTemplate="actionTemplate"></dxi-column>
          <div *dxTemplate="let data of 'amountTemplate'">
            {{data.value | currency : Currency}}
          </div>
          <div *dxTemplate="let data of 'quantityTemplate'">
            <dx-number-box #quantity [(value)]="data.data.quantity" [showSpinButtons]="true" [format]="NumberDxNumber" (onValueChanged)="onQuantityChange($event, data.data)" [disabled]="Model.id > 0"></dx-number-box>
          </div>
          <div *dxTemplate="let data of 'amountTemplate'">
            {{data.value | currency : Currency}}
          </div>
          <div *dxTemplate="let data of 'actionTemplate'">
            <button type="button" class="btn btn-danger btn-sm" (click)="removeDetail(data.data)" *ngIf="Model.id === 0">
              <i class="fas fa-trash"></i>
            </button>
          </div>
          <dxo-summary>
            <dxi-total-item 
            column="total" 
            summaryType="sum"
            [customizeText]="dxCustomizeCurrency"
            displayFormat="{0}"></dxi-total-item>
          </dxo-summary>
        </dx-data-grid>
      </div>
    </div>
  </div>
</app-modal-with-option-buttons>
