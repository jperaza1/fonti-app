<app-modal-with-option-buttons #entityComponent [title]="title" [optionButtons]="OptionButtons"
  (onOptionButton)="optionButtonClicked($event)" (onClose)="close()" [size]="'xxxl'">
  <div>
    <div class="row row-space-10">
      <section class="col-md-6 col-xs-12">
        <div class="form-group">
          <label>Producto<i class="text-danger">*</i></label>
          <dx-select-box displayExpr="text" valueExpr="value" [searchEnabled]="true"
            [items]="products" [(value)]="Model.productId" placeholder="Seleccione producto...">
          </dx-select-box>
          <app-validator-message [error]="errors" field="productId"></app-validator-message>
        </div>
      </section>
      <section class="col-md-6 col-xs-12">
        <div class="form-group">
          <label>Cantidad<i class="text-danger">*</i></label>
          <dx-number-box [(value)]="Model.quantity" [min]="0" format="#,##0.######"></dx-number-box>
          <app-validator-message [error]="errors" field="quantity"></app-validator-message>
        </div>
      </section>
      <section class="col-md-6 col-xs-12">
        <div class="form-group">
          <label>Fecha<i class="text-danger">*</i></label>
          <dx-date-box [(value)]="Model.movementDate" [displayFormat]="DisplayFormatDate"></dx-date-box>
          <app-validator-message [error]="errors" field="movementDate"></app-validator-message>
        </div>
      </section>
      <section class="col-md-6 col-xs-12">
        <div class="form-group">
          <label>Nota</label>
          <dx-text-box [(value)]="Model.note" placeholder="Compra, carga inicial..."></dx-text-box>
        </div>
      </section>
    </div>
  </div>
</app-modal-with-option-buttons>
