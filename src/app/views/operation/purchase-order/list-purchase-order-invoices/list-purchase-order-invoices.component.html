<div class="row">
  <div class="col-lg-12">
    <button
      class="btn btn-primary"
      type="button"
      (click)="addInvoice()" 
      [disabled]="orderStatus !== 3"
      [appCanAccess]="['OPERATION.INVOICE.CREATE']"
    >
      <i class="fa fa-plus"></i>
      Agregar Factura
    </button>
  </div>
</div>

<ng-container outsideBody>
  <div class="table-responsive text-nowrap">
    <dx-data-grid
    id="dataGrid"
    [dataSource]="DataSource"
    [columns]="columns"
    [remoteOperations]="false"
    [allowColumnReordering]="true"
    [rowAlternationEnabled]="true"
    [showBorders]="true"
    [columnAutoWidth]="true">
    <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager
        [showPageSizeSelector]="true"
        [allowedPageSizes]="[10, 25, 50, 100]"
      ></dxo-pager>
      <dxo-search-panel
        [visible]="true"
        [highlightCaseSensitive]="true"
      >
      </dxo-search-panel>
      <dxo-export [enabled]="true" fileName="Customers" [allowExportSelectedData]="false">
      </dxo-export>
      <div *dxTemplate="let data of 'actionTemplate'">
        <button
          type="button"
          class="btn btn-primary pull-left btn-sm"
          (click)="update(data.data)"
          title="Edit"
        >
          <i class="fa fa-edit"></i>
        </button>
        <button
          type="button"
          class="btn btn-primary pull-left btn-sm"
          (click)="onClickView(data.data)"
          *ngIf="data.data.orderStatus === 2"
        > 
          <i class="fa fa-file-pdf"></i>
        </button>
      </div>
      <div *dxTemplate="let data of 'invoiceNumberTemplate'" >
        {{ formatInvoiceNumber(data.value) }}
      </div>
      <div *dxTemplate="let data of 'dateTemplate'">
        {{ data.value | date: DisplayFormatDate }}
      </div>
      <div *dxTemplate="let data of 'amountTemplate'">
        {{ data.value | currency : Currency }}
      </div>
      <div *dxTemplate="let data of 'orderStatusTemplate'">
        <span *ngIf="data.data.orderStatus === 1" class="label label-warning">{{ data.data.orderStatusName }}</span>
        <span *ngIf="data.data.orderStatus === 2" class="label label-primary">{{ data.data.orderStatusName }}</span>
        <span *ngIf="data.data.orderStatus === 3" class="label label-secondary">{{ data.data.orderStatusName }}</span>
        <span *ngIf="data.data.orderStatus === 4" class="label label-success">{{ data.data.orderStatusName }}</span>
      </div>
    </dx-data-grid>
  </div>
</ng-container>

<app-create-or-update-po-invoices #createOrUpdateModal (modalSave)="getAll()"></app-create-or-update-po-invoices>
