<app-modal-with-option-buttons #entityComponent [title]="title" [optionButtons]="OptionButtons"
  (onOptionButton)="optionButtonClicked($event)" (onClose)="close()" [size]="'xxxl'">

  <div class="po-invoice-form">
    <div class="row">
      <!-- Columna izquierda: Formulario -->
      <div class="col-lg-6 col-md-12 col-12">
        <!-- Información general -->
        <section class="po-invoice-form__card po-invoice-form__card--animate">
          <h3 class="po-invoice-form__card-title">Información general</h3>
          <div class="row">
            <div class="col-lg-6 col-md-6 col-sm-12 col-12 po-invoice-form__field" *ngIf="Model.hasInvoice">
              <label class="po-invoice-form__label">Número de Factura <i class="text-danger">*</i></label>
              <dx-text-box #invoiceNumber [(value)]="Model.invoiceNumber" mask="000-000-00-00000000" [disabled]="orderStatus !== 3"></dx-text-box>
              <app-validator-message [error]="errors" field="invoiceNumber"></app-validator-message>
            </div>
            <div class="col-lg-6 col-md-6 col-sm-12 col-12 po-invoice-form__field">
              <label class="po-invoice-form__label">Fecha de Factura <i class="text-danger">*</i></label>
              <dx-date-box [(value)]="Model.invoiceDate" [displayFormat]="DisplayFormatDate" [disabled]="orderStatus !== 3"></dx-date-box>
              <app-validator-message [error]="errors" field="invoiceDate"></app-validator-message>
            </div>
            <div class="col-lg-6 col-md-6 col-sm-12 col-12 po-invoice-form__field">
              <label class="po-invoice-form__label">Tipo de Pago <i class="text-danger">*</i></label>
              <dx-select-box #paymentType [(value)]="Model.paymentType" [dataSource]="DxDataSourceInvoiceType" displayExpr="text" valueExpr="value" [disabled]="orderStatus !== 3" [searchEnabled]="true"></dx-select-box>
              <app-validator-message [error]="errors" field="paymentType"></app-validator-message>
            </div>
            <div class="col-lg-6 col-md-6 col-sm-12 col-12 po-invoice-form__field" *ngIf="Model.paymentType === 1">
              <label class="po-invoice-form__label">Método de Pago <i class="text-danger">*</i></label>
              <dx-select-box #paymentMethod [(value)]="Model.paymentMethod" [dataSource]="DxDataSourcePaymentMethod" displayExpr="text" valueExpr="value" [searchEnabled]="true"></dx-select-box>
              <app-validator-message [error]="errors" field="paymentMethod"></app-validator-message>
            </div>
            <div class="col-12 po-invoice-form__field">
              <label class="po-invoice-form__label">Descripción</label>
              <dx-text-area [height]="100" #description [(value)]="Model.description" [disabled]="orderStatus !== 3"></dx-text-area>
            </div>
          </div>
        </section>

        <!-- Montos -->
        <section class="po-invoice-form__card po-invoice-form__card--totals po-invoice-form__card--animate" *ngIf="Model.hasInvoice">
          <h3 class="po-invoice-form__card-title">Montos</h3>
          <div class="row">
            <div class="col-lg-4 col-md-4 col-sm-6 col-12 po-invoice-form__field" *ngIf="Model.hasInvoice">
              <label class="po-invoice-form__label">Monto Gravado <i class="text-danger">*</i></label>
              <dx-number-box #taxableAmount [(value)]="Model.taxableAmount" [format]="CurrencyDxNumber" [disabled]="orderStatus !== 3" (onValueChanged)="onAmountChanged($event)"></dx-number-box>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-6 col-12 po-invoice-form__field" *ngIf="Model.hasInvoice">
              <label class="po-invoice-form__label">Monto Exento <i class="text-danger">*</i></label>
              <dx-number-box #exemptAmount [(value)]="Model.exemptAmount" [format]="CurrencyDxNumber" [disabled]="orderStatus !== 3" (onValueChanged)="onAmountChanged($event)"></dx-number-box>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-6 col-12 po-invoice-form__field" *ngIf="Model.hasInvoice">
              <label class="po-invoice-form__label">Descuento</label>
              <dx-number-box #discount [(value)]="Model.discount" [format]="CurrencyDxNumber" [disabled]="orderStatus !== 3" (onValueChanged)="onAmountChanged($event)"></dx-number-box>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-6 col-12 po-invoice-form__field" *ngIf="Model.hasInvoice">
              <label class="po-invoice-form__label">Subtotal <i class="text-danger">*</i></label>
              <dx-number-box #subTotal [(value)]="Model.subTotal" [format]="CurrencyDxNumber" [disabled]="true"></dx-number-box>
              <app-validator-message [error]="errors" field="subTotal"></app-validator-message>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-6 col-12 po-invoice-form__field" *ngIf="Model.hasInvoice">
              <label class="po-invoice-form__label">ISV 15%</label>
              <dx-number-box #taxAmount [(value)]="Model.taxAmount" [format]="CurrencyDxNumber" [disabled]="orderStatus !== 3" (onValueChanged)="onTaxAmountChanged($event)"></dx-number-box>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-6 col-12 po-invoice-form__field po-invoice-form__field--highlight">
              <label class="po-invoice-form__label">Total <i class="text-danger">*</i></label>
              <dx-number-box #total [(value)]="Model.total" [format]="CurrencyDxNumber" [disabled]="true"></dx-number-box>
              <app-validator-message [error]="errors" field="total"></app-validator-message>
            </div>
          </div>
        </section>
      </div>

      <!-- Alta: el archivo se envía en el mismo POST AddInvoice -->
      <div class="col-lg-6 col-md-12 col-12" *ngIf="isNewInvoice && orderStatus === 3">
        <section class="po-invoice-form__card po-invoice-form__card--documents po-invoice-form__card--animate">
          <h3 class="po-invoice-form__card-title">Factura <i class="text-danger">*</i></h3>
          <p class="po-invoice-form__upload-hint m-b-10">
            Adjunte el comprobante antes de guardar; se envía junto con los datos.
          </p>
          <div class="po-invoice-form__upload">
            <div class="po-invoice-form__upload-inner">
              <label class="po-invoice-form__upload-label">
                <i class="fa fa-cloud-upload-alt"></i>
                Subir documento
              </label>
              <dx-file-uploader
                (onValueChanged)="onFileChanged($event)"
                uploadUrl=""
                [multiple]="false"
                accept="*"
                [(value)]="DocumentFiles"
                uploadMode="useButtons"
                [showFileList]="true"
                [allowedFileExtensions]="[]">
              </dx-file-uploader>
              <app-validator-message [error]="errors" field="invoiceFile"></app-validator-message>
            </div>
          </div>
        </section>
      </div>

      <!-- Factura ya creada: carga o vista previa del adjunto -->
      <div class="col-lg-6 col-md-12 col-12" *ngIf="Model.id > 0">
        <section class="po-invoice-form__card po-invoice-form__card--documents po-invoice-form__card--animate">
          <h3 class="po-invoice-form__card-title">Factura</h3>

          <!-- Formulario de carga cuando no hay archivo -->
          <div class="po-invoice-form__upload" *ngIf="!Model.hasFile">
            <div class="po-invoice-form__upload-inner">
              <label class="po-invoice-form__upload-label">
                <i class="fa fa-cloud-upload-alt"></i>
                Subir documento
              </label>
              <p class="po-invoice-form__upload-hint">Seleccione un archivo para subir.</p>
              <dx-file-uploader
                #fileUploader
                (onValueChanged)="onFileChanged($event)"
                (onUploaded)="onFileUploaded($event)"
                uploadUrl=""
                [multiple]="false"
                accept="*"
                [(value)]="DocumentFiles"
                uploadMode="useButtons"
                [showFileList]="true"
                [allowedFileExtensions]="[]">
              </dx-file-uploader>
            </div>
          </div>

          <!-- Vista previa cuando hay archivo -->
          <div class="po-invoice-form__preview" *ngIf="Model.hasFile && Model.documentId > 0">
            <div class="po-invoice-doc-preview" (click)="openImageLightbox()" role="button" tabindex="0" (keydown.enter)="openImageLightbox()" (keydown.space)="openImageLightbox()">
              <div class="po-invoice-doc-preview__frame">
                <img [src]="getDocumentImageUrl(Model.documentId)" alt="Vista previa de la factura" class="po-invoice-doc-preview__img" />
                <div class="po-invoice-doc-preview__overlay">
                  <span class="po-invoice-doc-preview__icon"><i class="fa fa-eye"></i></span>
                  <span class="po-invoice-doc-preview__hint">Ver en grande</span>
                </div>
              </div>
            </div>
            <button type="button" class="po-invoice-form__btn po-invoice-form__btn--danger" (click)="deleteDocumentById()">
              <i class="fa fa-trash"></i> Eliminar
            </button>
          </div>
        </section>
      </div>
    </div>
  </div>
</app-modal-with-option-buttons>

<!-- Lightbox -->
<div class="po-invoice-lightbox" *ngIf="showImageLightbox" (click)="closeImageLightbox()" role="dialog" aria-modal="true" aria-label="Vista ampliada del documento">
  <button class="po-invoice-lightbox__close" (click)="closeImageLightbox(); $event.stopPropagation()" aria-label="Cerrar">
    <i class="fa fa-times" aria-hidden="true"></i>
  </button>
  <div class="po-invoice-lightbox__content" (click)="$event.stopPropagation()">
    <img [src]="getDocumentImageUrl(Model.documentId)" alt="Documento en tamaño completo" class="po-invoice-lightbox__img" />
  </div>
</div>
