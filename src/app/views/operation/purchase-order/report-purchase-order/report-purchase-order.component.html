<panel [title]="title" footerClass="p-b-0 p-t-20 b-t-0">
  <div class="row row-space-10">
    <section class="col-md-3 col-xs-12">
      <div class="form-group">
        <label for="name">Proveedor</label>
        <dx-select-box #vendorId [(value)]="filterPurchaseOrderDto.vendorId" [dataSource]="DxDatasourceVendor" displayExpr="name" valueExpr="id" [searchEnabled]="true"></dx-select-box>
      </div>
    </section>
    <section class="col-md-3 col-xs-12">
      <div class="form-group">
        <label for="name">Estado</label>
        <dx-select-box #orderStatus [(value)]="filterPurchaseOrderDto.orderStatus" [dataSource]="DxDatasourcePurchaseOrderStatus" displayExpr="text" valueExpr="value" [searchEnabled]="true" ></dx-select-box>
      </div>
    </section>
    <section class="col-md-3 col-xs-12">
      <div class="form-group">
        <label for="name">Inicio</label>
        <dx-date-box [(max)]="filterPurchaseOrderDto.endDate" [(value)]="filterPurchaseOrderDto.startDate" [displayFormat]="DisplayFormatDate"></dx-date-box>
      </div>
    </section>
    <section class="col-md-3 col-xs-12">
      <div class="form-group">
        <label for="name">Fin</label>
        <dx-date-box [(value)]="filterPurchaseOrderDto.endDate" [displayFormat]="DisplayFormatDate" [(min)]="filterPurchaseOrderDto.startDate"></dx-date-box>
      </div>
    </section>
    <section class="col-md-4 col-xs-12" style="margin-top: 25px;">
      <button class="btn btn-primary" (click)="generateReport()"><i class="fa fa-search"></i> Generar Reporte</button>
    </section>
  </div>
  <div class="row row-space-10" style="margin-top: 20px;">
    <dx-pivot-grid
      id="pivotgrid"
      #pivotGrid
      [allowSortingBySummary]="true"
      [allowFiltering]="true"
      [showBorders]="true"
      [allowSortingBySummary]="true"
      [showColumnGrandTotals]="true"
      [showRowGrandTotals]="true"
      [showRowTotals]="true"
      [showColumnTotals]="true"
      [dataSource]="pivotGridDataSource"
    >
      <dxo-field-chooser [enabled]="true" [height]="400"></dxo-field-chooser>
      <dxo-scrolling mode="virtual"></dxo-scrolling>
      <dxo-export [enabled]="true"></dxo-export>
      <dxo-summary>
        <dxi-total-item column="totalRecived" summaryType="sum" [customizeText]="dxCustomizeCurrency" displayFormat="{0}"></dxi-total-item>
      </dxo-summary>
    </dx-pivot-grid>
  </div>
</panel>
