<panel [title]="title" footerClass="p-b-0 p-t-20 b-t-0">
  <div class="row row-space-10">
    <section class="col-md-6 col-xs-12">
      <div class="form-group">
        <label for="name">Inicio</label>
        <dx-date-box [(max)]="filterModel.endDate" [(value)]="filterModel.startDate" [displayFormat]="DisplayFormatDate"></dx-date-box>
      </div>
    </section>
    <section class="col-md-6 col-xs-12">
      <div class="form-group">
        <label for="name">Fin</label>
        <dx-date-box [(value)]="filterModel.endDate" [displayFormat]="DisplayFormatDate" [(min)]="filterModel.startDate"></dx-date-box>
      </div>
    </section>
    <section class="col-md-4 col-xs-12" style="margin-top: 25px;">
      <button 
        class="btn btn-primary" 
        (click)="create()"
        [appCanAccess]="['OPERATION.PAYMENT.CREATE']">
          <i class="fa fa-plus"></i> 
        Agregar
      </button>
      <button
        class="btn btn-primary"
        type="button"
        (click)="getAll()"
      >
        <i class="fa fa-search"></i>
        Buscar
      </button>
    </section>
  </div>
  <div class="row row-space-10">
    <section class="col-md-12 col-xs-12">
      <dx-data-grid
    id="dataGrid"
    [dataSource]="DataSource"
    [columns]="columns"
    [remoteOperations]="false"
    [allowColumnReordering]="true"
    [rowAlternationEnabled]="true"
    [showBorders]="true"
    [columnAutoWidth]="true">
    <dxo-paging [pageSize]="10"></dxo-paging>
    <dxo-pager
      [showPageSizeSelector]="true"
      [allowedPageSizes]="[10, 25, 50, 100]"
    ></dxo-pager>
    <dxo-search-panel
      [visible]="true"
      [highlightCaseSensitive]="true"
    >
    </dxo-search-panel>
    <dxo-export [enabled]="true" fileName="Pagos" [allowExportSelectedData]="false">
    </dxo-export>
    <dxo-header-filter [visible]="true"></dxo-header-filter>

    <div *dxTemplate="let data of 'bankReferenceTemplate'">
      <span *ngIf="data.data.paymentStatus !== 2 || !updateBankReference">{{ data.data.bankReference }}</span>
      <dx-text-box *ngIf="data.data.paymentStatus === 2 && updateBankReference" [(value)]="data.data.bankReference" (focusout)="onFocusOutBankReference(data.data)"></dx-text-box>

    </div>
    <div *dxTemplate="let data of 'actionTemplate'">
      <button
        type="button"
        class="btn btn-primary pull-left btn-sm"
        (click)="update(data.data)"
        [appCanAccess]="['OPERATION.PAYMENT.UPDATE']"
        title="Editar"
      >
        <i class="fa fa-edit"></i>
      </button>
      <button
        type="button"
        class="btn btn-danger pull-left btn-sm"
        (click)="delete(data.data)"
        [appCanAccess]="['OPERATION.PAYMENT.DELETE']"
        title="Eliminar"
        *ngIf="data.data.paymentStatus !== 3"
      >
        <i class="fa fa-trash"></i>
      </button>
    </div>
    <div *dxTemplate="let data of 'dateTemplate'">
      {{ data.value | date: DisplayFormatDate }}
    </div>
    <div *dxTemplate="let data of 'amountTemplate'">
      {{ data.value | currency : Currency }}
    </div>
    <div *dxTemplate="let data of 'notesTemplate'">
      <span *ngIf="data.data.paymentStatus === 3 || !updateBankReference">{{ data.data.notes }}</span>
      <dx-text-area [(value)]="data.data.notes" *ngIf="data.data.paymentStatus !== 3 && updateBankReference" (focusout)="onFocusOutNotes(data.data)"></dx-text-area>
    </div>
    <dxo-summary>
      <dxi-total-item 
      column="amount" 
      summaryType="sum"
      [customizeText]="dxCustomizeCurrency"
      displayFormat="{0}"></dxi-total-item>
    </dxo-summary>
    </dx-data-grid>
    </section>
    
  </div>
</panel>
