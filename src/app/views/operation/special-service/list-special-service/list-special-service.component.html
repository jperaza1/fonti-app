<panel [title]="title" footerClass="p-b-0 p-t-20 b-t-0">
  <div class="row row-space-10">
    <section class="col-md-6 col-xs-12">
      <div class="form-group">
        <label for="name">Cafeteria</label>
        <dx-select-box #cafeteriaId [(value)]="filterModel.cafeteriaId" [dataSource]="DxDatasourceCafeteria" displayExpr="name" valueExpr="id" [disabled]="currentUser.cafeteriaId" [searchEnabled]="true"></dx-select-box>
      </div>
    </section>
    <section class="col-md-6 col-xs-12">
      <div class="form-group">
        <label for="name">Estado</label>
        <dx-select-box #orderStatus [(value)]="filterModel.status" [dataSource]="DxDatasourceStatus" displayExpr="text" valueExpr="value" [searchEnabled]="true" ></dx-select-box>
      </div>
    </section>
    <section class="col-md-6 col-xs-12">
      <div class="form-group">
        <label for="name">Inicio</label>
        <dx-date-box [(max)]="filterModel.endDate" [(value)]="filterModel.startDate" [displayFormat]="DisplayFormatDate"></dx-date-box>
      </div>
    </section>
    <section class="col-md-6 col-xs-12">
      <div class="form-group">
        <label for="name">Fin</label>
        <dx-date-box [(value)]="filterModel.endDate" [displayFormat]="DisplayFormatDate" [(min)]="filterModel.startDate"></dx-date-box>
      </div>
    </section>
    <section class="col-md-4 col-xs-12" style="margin-top: 25px;">
      <button class="btn btn-primary" (click)="getAll()"><i class="fa fa-search"></i> Buscar</button>
      <button
        class="btn btn-primary"
        type="button"
        (click)="onClickNew()"
        [appCanAccess]="['OPERATION.SPECIAL_SERVICE.CREATE']"
      >
        <i class="fa fa-plus"></i>
        Nueva
      </button>
    </section>
    <section class="col-md-12 col-xs-12">
      
      <button
        class="btn btn-warning pull-right"
        type="button"
        (click)="onClickRefresh()"
      >
        <i class="fas fa-sync-alt"></i>
      </button>
    </section>
  </div>
  <div class="row row-space-10" style="margin-top: 20px;">
    <dx-data-grid
      id="dataGrid"
      [dataSource]="DataSource"
      [columns]="columns"
      [remoteOperations]="false"
      [allowColumnReordering]="true"
      [rowAlternationEnabled]="true"
      [showBorders]="true"
      [columnAutoWidth]="true">
      <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager
          [showPageSizeSelector]="true"
          [allowedPageSizes]="[10, 25, 50, 100]"
        ></dxo-pager>
        <dxo-search-panel
          [visible]="true"
          [highlightCaseSensitive]="true"
        >
        </dxo-search-panel>
        <dxo-export [enabled]="true" fileName="Customers" [allowExportSelectedData]="false">
        </dxo-export>
        <div *dxTemplate="let data of 'actionTemplate'">
          <button
            type="button"
            class="btn btn-primary pull-left btn-sm"
            (click)="update(data.data)"
            title="Edit"
          >
            <i class="fa fa-edit"></i>
          </button>
          <button
            type="button"
            class="btn btn-primary pull-left btn-sm"
            (click)="onClickView(data.data)"
            *ngIf="data.data.status === 2"
            [appCanAccess]="['OPERATION.SPECIAL_SERVICE.REVIEW']"
          > 
            <i class="fa fa-file-pdf"></i>
          </button>
        </div>
        <div *dxTemplate="let data of 'dateTemplate'">
          {{ data.data.date | date: DisplayFormatDate }}
        </div>
        <div *dxTemplate="let data of 'amountTemplate'">
          {{ data.value | currency : Currency }}
        </div>
        <div *dxTemplate="let data of 'hasInvoiceTemplate'">
          <span *ngIf="data.data.hasInvoice" class="label label-success">Si</span>
          <span *ngIf="!data.data.hasInvoice" class="label label-danger">No</span>
        </div>
        <div *dxTemplate="let data of 'orderStatusTemplate'">
          <span *ngIf="data.data.status === 1" class="label label-warning">{{ data.data.statusName }}</span>
          <span *ngIf="data.data.status === 2" class="label label-success">{{ data.data.statusName }}</span>
          <span *ngIf="data.data.status === 3" class="label label-danger">{{ data.data.statusName }}</span>
        </div>
    </dx-data-grid>
  </div>
</panel>
