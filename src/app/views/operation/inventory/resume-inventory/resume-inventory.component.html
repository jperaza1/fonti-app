<app-modal-with-option-buttons #entityComponent [title]="title" [optionButtons]="OptionButtons"
  (onOptionButton)="optionButtonClicked($event)" (onClose)="close()" size="xxxl">
  <div class="row row-space-10">
    <section class="col-md-12 col-xs-12" *ngIf="type == 1">
      <dx-data-grid
        #dataGrid
        [dataSource]="Model"
        [columns]="columns"
        [remoteOperations]="false"
        [allowColumnReordering]="true"
        [rowAlternationEnabled]="true"
        [showBorders]="true"
        [columnAutoWidth]="true">
        <dxo-export [enabled]="true" fileName="ResumenInventario" [allowExportSelectedData]="false">
        </dxo-export>
          <dxo-search-panel
            [visible]="true"
            [highlightCaseSensitive]="true">
          </dxo-search-panel>

          <div *dxTemplate="let data of 'amountTemplate'">
            {{ data.value | currency : Currency }}
          </div>
          <dxo-summary>
            <dxi-total-item 
            column="total" 
            summaryType="sum"
            [customizeText]="dxCustomizeCurrency"
            displayFormat="{0}"></dxi-total-item>
          </dxo-summary>
      </dx-data-grid>
    </section>
    <section class="col-md-12 col-xs-12" *ngIf="type == 2">
      <dx-data-grid
        #dataGrid
        [dataSource]="ModelDetails"
        [remoteOperations]="false"
        [allowColumnReordering]="true"
        [rowAlternationEnabled]="true"
        [showBorders]="true"
        [columnAutoWidth]="true">
        <dxo-export [enabled]="true" fileName="DetallesInventario" [allowExportSelectedData]="false">
        </dxo-export>
          <dxo-search-panel
            [visible]="true"
            [highlightCaseSensitive]="true">
          </dxo-search-panel>

          <dxi-column dataField="product" caption="Producto" ></dxi-column>
          <dxi-column dataField="cost" caption="Costo" cellTemplate="amountTemplate"></dxi-column>
          <dxi-column dataField="unitCost" caption="Costo Unitario" cellTemplate="amountTemplate"></dxi-column>
          <dxi-column dataField="quantityPack" caption="Cantidad de Paquete" ></dxi-column>
          <dxi-column dataField="unitQuantity" caption="Cantidad Unitaria"></dxi-column>
          <dxi-column dataField="subTotal" caption="Subtotal" cellTemplate="amountTemplate"></dxi-column>
          <dxi-column dataField="discount" caption="Descuento" cellTemplate="amountTemplate" ></dxi-column>
          <dxi-column dataField="tax" caption="Impuesto" cellTemplate="amountTemplate" ></dxi-column>
          <dxi-column dataField="total" caption="Total" cellTemplate="amountTemplate"></dxi-column>

          <div *dxTemplate="let data of 'amountTemplate'">
            {{ data.value | currency : Currency }}
          </div>
          <dxo-summary>
            <dxi-total-item 
            column="total" 
            summaryType="sum"
            [customizeText]="dxCustomizeCurrency"
            displayFormat="{0}"></dxi-total-item>
          </dxo-summary>
      </dx-data-grid>
    </section>
  </div>

</app-modal-with-option-buttons>
