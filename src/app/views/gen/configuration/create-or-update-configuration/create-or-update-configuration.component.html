<app-modal-with-option-buttons #entityComponent title="Configuration" [optionButtons]="OptionButtons"
  (onOptionButton)="optionButtonClicked($event)" (onClose)="close()">
  <div>
    <div class="row row-space-10">
      <section class="col-md-12">
        <div class="form-group">
          <label for="key">Key<i class="text-danger">*</i></label>
          <dx-text-box [disabled]="Model.id > 0" #key [(value)]="Model.key">
          </dx-text-box>
          <app-validator-message [error]="errors" field="key"></app-validator-message>
        </div>
      </section>

      <section class="col-md-12">
        <div class="form-group">
          <label for="value">Value<i class="text-danger">*</i></label>
          <dx-text-box #value [(value)]="Model.value">
          </dx-text-box>
          <app-validator-message [error]="errors" field="value"></app-validator-message>
        </div>
      </section>
    </div>
  </div>
</app-modal-with-option-buttons>
