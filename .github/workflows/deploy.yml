name: Deploy Angular to IIS via WebDeploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 14

      - name: Install Build Tools
        run: |
          choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional --passive --norestart"
        

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Install dependencies
        run: npm install

      - name: Build Angular app (with web.config)
        run: npm run build

      - name: Install Web Deploy Tools
        run: |
          Invoke-WebRequest -Uri https://github.com/Microsoft/WebDeploy/releases/download/v3.6.0/WebDeploy_amd64_en-US.msi -OutFile webdeploy.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'webdeploy.msi', '/quiet'

      - name: Deploy via WebDeploy
        run: |
          & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" `
          -verb:sync `
          -source:contentPath="dist/your-app-name" `
          -dest:auto,computerName="${{ secrets.DEPLOY_SERVER }}",userName="${{ secrets.DEPLOY_USER }}",password="${{ secrets.DEPLOY_PASSWORD }}",authType="Basic"
